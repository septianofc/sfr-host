version: '3.8'

services:
  sfrhost-gateway:
    build: .
    container_name: sfrhost-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORT=80
      - GATEWAY_SECRET=sfrhost_secure_gateway_token_2026
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
